name: Bootstrap Release

on:
  push:
    paths:
      - ".github/workflows/bootstrap-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create initial GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "v0.1.0 - 初始 Release" \
            --notes "首次建立 GitHub Release，以当前默认分支状态作为版本基线。后续正式更新请按照 RELEASE_POLICY.md 的规范发布新的 Release。"
