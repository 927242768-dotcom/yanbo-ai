<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<title>彦博 AI</title>
<style>
:root{
  color-scheme:light;
  --bg:#f8fafc;--panel:#ffffff;--panel-soft:#f1f5f9;--panel-hover:#e9eef5;
  --text:#172033;--muted:#64748b;--muted-2:#94a3b8;--line:#e2e8f0;
  --primary:#2563eb;--primary-strong:#1d4ed8;--primary-soft:#eff6ff;
  --danger:#dc2626;--shadow:0 18px 50px rgba(15,23,42,.10);
  --sidebar:292px;--radius:18px;
}
@media(prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#0b0f16;--panel:#111827;--panel-soft:#182130;--panel-hover:#202b3c;--text:#e8edf5;--muted:#9aa8bc;--muted-2:#738197;--line:#263244;--primary:#4f8cff;--primary-strong:#76a4ff;--primary-soft:#17233a;--shadow:0 18px 50px rgba(0,0,0,.30)}
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
svg{display:block}
.app-shell{height:100%;display:flex;position:relative}
.sidebar{width:var(--sidebar);height:100%;flex:0 0 var(--sidebar);display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));z-index:40}
.brand-row{height:48px;display:flex;align-items:center;gap:11px;padding:0 7px 10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#2563eb,#7c3aed);color:white;font-size:18px;font-weight:800;box-shadow:0 8px 20px rgba(37,99,235,.24)}
.brand-text{min-width:0;flex:1}.brand-text strong{display:block;font-size:16px}.brand-text span{font-size:11px;color:var(--muted)}
.new-chat{height:46px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;box-shadow:0 4px 12px rgba(15,23,42,.04);transition:.18s}
.new-chat:active{transform:scale(.985);background:var(--panel-soft)}
.search-wrap{position:relative;margin:10px 0 8px}.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
#search{width:100%;height:40px;border:0;border-radius:12px;background:var(--panel-soft);outline:none;padding:0 12px 0 39px;font-size:13px}
.section-label{padding:7px 9px 5px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.conversation-list{flex:1;min-height:0;overflow:auto;padding:2px 0 8px;scrollbar-width:thin}
.conversation-item{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:49px;margin:2px 0;padding:8px 7px 8px 12px;border:0;border-radius:12px;background:transparent;text-align:left;transition:.16s}
.conversation-item:hover,.conversation-item:active{background:var(--panel-soft)}
.conversation-item.active{background:var(--primary-soft)}
.conversation-main{min-width:0;flex:1}.conversation-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:650}.conversation-time{margin-top:3px;color:var(--muted);font-size:10px}
.conversation-more{width:32px;height:32px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;color:var(--muted);opacity:.72}.conversation-more:active{background:var(--panel-hover);opacity:1}
.sidebar-footer{border-top:1px solid var(--line);padding:10px 8px 2px;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:8px}.connection-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.12)}.connection-dot.online{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.44);backdrop-filter:blur(2px);z-index:30}
.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;flex:0 0 auto;display:flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);z-index:20}
.topbar-title{min-width:0;flex:1;text-align:center}.topbar-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:720;line-height:1.2}.topbar-title span{display:block;margin-top:2px;color:var(--muted);font-size:9.5px}
.icon-btn{width:36px;height:36px;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;color:var(--text)}.icon-btn:active{background:var(--panel-soft)}
#menu{display:none}
#update{display:none;margin:6px auto 0;width:min(760px,calc(100% - 20px));padding:7px 10px;border:1px solid color-mix(in srgb,var(--primary) 22%,var(--line));border-radius:11px;background:var(--primary-soft);color:var(--primary-strong);font-size:11px;text-align:center}#update button{margin-left:5px;border:0;background:transparent;color:var(--primary-strong);font-weight:750;padding:2px 4px}
.chat-scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.chat-inner{width:min(760px,100%);min-height:100%;margin:0 auto;padding:18px 16px 18px}
.empty-state{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:clamp(42px,8vh,76px) 12px 18px}
.empty-logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#2563eb,#7c3aed);color:white;font-size:25px;font-weight:850;box-shadow:0 12px 28px rgba(37,99,235,.18)}
.empty-state h2{margin:15px 0 6px;font-size:20px;line-height:1.3;letter-spacing:-.02em}.empty-state p{max-width:390px;margin:0;color:var(--muted);font-size:12.5px;line-height:1.65}
.suggestions{width:min(520px,100%);display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.suggestion{min-height:58px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left;box-shadow:none}.suggestion:active{transform:scale(.985);background:var(--panel-soft)}.suggestion strong{display:block;font-size:12.5px;line-height:1.35}.suggestion span{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.4}
.message{display:flex;gap:10px;margin:0 0 18px;animation:messageIn .18s ease-out}@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:grid;place-items:center;margin-top:2px;font-size:12px;font-weight:800}.assistant .avatar{background:linear-gradient(145deg,#2563eb,#7c3aed);color:white}.user .avatar{display:none}
.message-body{min-width:0;max-width:86%}.assistant .message-body{max-width:calc(100% - 41px)}
.bubble{font-size:13.5px;line-height:1.68;overflow-wrap:anywhere}.user .bubble{padding:9px 12px;border-radius:16px 16px 5px 16px;background:var(--primary);color:white;box-shadow:0 5px 14px rgba(37,99,235,.13)}.assistant .bubble{padding:1px 1px 0}
.bubble p{margin:.25em 0 .8em}.bubble p:last-child{margin-bottom:0}.bubble strong{font-weight:750}.bubble h1,.bubble h2,.bubble h3{margin:1em 0 .5em;line-height:1.35}.bubble h1{font-size:20px}.bubble h2{font-size:17px}.bubble h3{font-size:15px}.bubble pre{margin:10px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0f172a;color:#e2e8f0;overflow:auto;font-size:12px;line-height:1.55}.bubble code{padding:2px 5px;border-radius:6px;background:var(--panel-soft);font-family:"SFMono-Regular",Consolas,monospace;font-size:.88em}.bubble pre code{padding:0;background:transparent}.bubble ul,.bubble ol{padding-left:21px;margin:.5em 0}.bubble li{margin:.25em 0}
.message-photo{display:block;max-width:min(360px,72vw);max-height:320px;object-fit:contain;margin:0 0 8px auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.message-actions{display:flex;align-items:center;gap:3px;margin-top:7px;opacity:.78}.message-action{height:30px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px}.message-action:active{background:var(--panel-soft);color:var(--text)}
.thinking{display:flex;align-items:center;gap:10px;min-height:34px;color:var(--muted);font-size:13px}.thinking-orb{width:26px;height:26px;border-radius:9px;background:linear-gradient(145deg,rgba(37,99,235,.16),rgba(124,58,237,.16));display:grid;place-items:center}.thinking-orb:before{content:"";width:11px;height:11px;border:2px solid var(--primary);border-right-color:transparent;border-radius:50%;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.thinking-dots{display:inline-flex;gap:3px;margin-left:2px}.thinking-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:bounce 1.1s infinite}.thinking-dots i:nth-child(2){animation-delay:.16s}.thinking-dots i:nth-child(3){animation-delay:.32s}@keyframes bounce{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.ocr-box{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);overflow:hidden}.ocr-box summary{padding:9px 11px;cursor:pointer;color:var(--muted);font-size:11px}.ocr-box pre{margin:0;padding:0 11px 11px;background:transparent;color:var(--text);border:0;border-radius:0;white-space:pre-wrap;font-family:inherit}
.composer-wrap{flex:0 0 auto;padding:6px 10px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 82%,transparent)}
.composer{width:min(760px,100%);margin:0 auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 5px 18px rgba(15,23,42,.07);padding:5px 6px;transition:.18s}.composer:focus-within{border-color:color-mix(in srgb,var(--primary) 38%,var(--line));box-shadow:0 6px 20px rgba(37,99,235,.08)}
.mode-row{display:flex;align-items:center;padding:1px 2px 5px}.mode-switch{display:grid;grid-template-columns:1fr 1fr 1fr;width:min(430px,100%);padding:3px;border-radius:12px;background:var(--panel-soft)}.mode-option{height:30px;padding:0 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:11px;font-weight:720;display:flex;align-items:center;justify-content:center;gap:5px;transition:.16s}.mode-option.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(15,23,42,.08)}.mode-option.active[data-mode="thinking"]{color:var(--primary-strong)}.mode-option.active[data-mode="expert"]{color:#7c3aed}.mode-spark{font-size:12px}.mode-option:active{transform:scale(.98)}
#preview{display:none;align-items:center;gap:10px;padding:3px 4px 9px}.preview-image{width:62px;height:50px;object-fit:cover;border:1px solid var(--line);border-radius:11px}.preview-info{min-width:0;flex:1}.preview-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.preview-info span{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.composer-row{display:flex;align-items:flex-end;gap:3px}.composer-tools{display:flex;align-items:center;gap:0}.composer-tool{width:34px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center}.composer-tool:active{background:var(--panel-soft);color:var(--text)}
#input{flex:1;min-width:0;min-height:38px;max-height:126px;padding:8px 5px;border:0;outline:0;resize:none;background:transparent;line-height:1.45;font-size:13.5px}
.send-btn{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;background:var(--primary);color:white;display:grid;place-items:center;box-shadow:0 4px 12px rgba(37,99,235,.17)}.send-btn:active{transform:scale(.96)}.stop-btn{display:none;width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;background:var(--text);color:var(--panel);place-items:center}.stop-btn.visible{display:grid}
.composer-hint{text-align:center;margin:3px 0 0;color:var(--muted-2);font-size:8.5px;line-height:1.2}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.menu-popover{display:none;position:fixed;min-width:170px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);z-index:80}.menu-popover.open{display:block}.menu-item{width:100%;height:40px;padding:0 11px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;gap:9px;text-align:left;font-size:13px}.menu-item:active{background:var(--panel-soft)}.menu-item.danger{color:var(--danger)}
.dialog-backdrop{display:none;position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.48);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px}.dialog-backdrop.open{display:flex}.dialog-card{width:min(360px,100%);border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);padding:20px}.dialog-card h3{margin:0;font-size:17px}.dialog-card p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.dialog-card input{width:100%;height:44px;margin-top:16px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);outline:none}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-button{height:40px;padding:0 15px;border:0;border-radius:11px;background:var(--panel-soft);font-weight:650}.dialog-button.primary{background:var(--primary);color:white}.dialog-button.danger{background:var(--danger);color:white}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));z-index:120;transform:translate(-50%,12px);padding:8px 13px;border-radius:999px;background:rgba(15,23,42,.92);color:white;font-size:10.5px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.update-card{width:min(370px,100%);border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:var(--shadow);padding:22px}.update-icon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#2563eb,#7c3aed);color:#fff;margin-bottom:15px}.update-card h3{margin:0;font-size:18px}.update-version{margin-top:5px;color:var(--primary);font-size:12px;font-weight:700}.update-notes{margin:14px 0 0;padding:12px 14px;border-radius:13px;background:var(--panel-soft);color:var(--muted);font-size:12px;line-height:1.6}.update-notes div+div{margin-top:5px}.update-progress{display:none;margin-top:14px}.update-progress.show{display:block}.update-progress-track{height:6px;border-radius:99px;background:var(--panel-soft);overflow:hidden}.update-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .25s}.update-progress-text{margin-top:7px;color:var(--muted);font-size:11px}.update-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.update-button{height:40px;padding:0 16px;border:0;border-radius:11px;background:var(--panel-soft);font-size:13px;font-weight:700}.update-button.primary{background:var(--primary);color:#fff}.update-button:disabled{opacity:.65}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}.drawer-overlay.open{display:block}#menu{display:grid}.chat-inner{padding:20px 14px 18px}.message-body{max-width:91%}.assistant .message-body{max-width:calc(100% - 40px)}
}
@media(max-width:520px){.empty-state{padding-top:clamp(38px,7vh,62px)}.topbar{padding-left:7px;padding-right:7px}.composer-wrap{padding-left:7px;padding-right:7px}.chat-inner{padding-left:11px;padding-right:11px}.suggestions{gap:7px}.suggestion{padding:9px 10px}}
@media(max-width:350px){.suggestions{grid-template-columns:1fr}.empty-state{padding-top:30px}}
</style>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar" aria-label="对话列表">
    <div class="brand-row"><div class="logo">彦</div><div class="brand-text"><strong>彦博 AI</strong><span>你的本地智能助手</span></div></div>
    <button id="newChat" class="new-chat" type="button" aria-label="新建对话">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建对话
    </button>
    <div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="搜索对话" autocomplete="off"></div>
    <div class="section-label">最近对话</div>
    <div id="conversationList" class="conversation-list"></div>
    <div class="sidebar-footer"><span id="connectionDot" class="connection-dot"></span><span id="connectionText">正在连接电脑服务</span></div>
  </aside>
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <main class="main">
    <header class="topbar">
      <button id="menu" class="icon-btn" type="button" aria-label="打开对话列表"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="topbar-title"><strong id="chatTitle">新对话</strong><span id="chatSubtitle">彦博-v3</span></div>
      <button id="headerNew" class="icon-btn" type="button" aria-label="新建对话"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="chatMenu" class="icon-btn" type="button" aria-label="对话设置"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
    </header>
    <div id="update"></div>
    <section id="chat" class="chat-scroll" aria-live="polite"><div id="chatInner" class="chat-inner"></div></section>
    <div class="composer-wrap">
      <div class="composer">
        <div class="mode-row"><div class="mode-switch" role="tablist" aria-label="回答模式"><button id="modeThinking" class="mode-option active" data-mode="thinking" type="button" role="tab" aria-selected="true"><span class="mode-spark">✦</span>彦博-思考</button><button id="modeFast" class="mode-option" data-mode="fast" type="button" role="tab" aria-selected="false"><span class="mode-spark">⚡</span>彦博-快速</button><button id="modeExpert" class="mode-option" data-mode="expert" type="button" role="tab" aria-selected="false"><span class="mode-spark">◆</span>彦博-专家</button></div></div>
        <div id="preview"><img id="previewImg" class="preview-image" alt="图片预览"><div class="preview-info"><strong id="previewName"></strong><span>默认OCR分析；专家视觉启用时同时读取原图</span></div><button id="remove" class="composer-tool" type="button" aria-label="移除图片"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="composer-row">
          <div class="composer-tools">
            <button id="camera" class="composer-tool" type="button" aria-label="拍照"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2l1.3-2h4.4l1.3 2h2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg></button>
            <button id="gallery" class="composer-tool" type="button" aria-label="选择图片"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="17" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4.2-4.2 3.1 3.1 2.2-2.2L19 18"/></svg></button>
          </div>
          <textarea id="input" rows="1" placeholder="给彦博发送消息……"></textarea>
          <button id="send" class="send-btn" type="button" aria-label="发送"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button>
          <button id="stop" class="stop-btn" type="button" aria-label="停止生成"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        </div>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="galleryInput" type="file" accept="image/*" hidden>
        <div class="composer-hint">彦博可能会犯错，重要信息请核验</div>
        <div id="status" class="sr-only" aria-live="polite"></div>
      </div>
    </div>
  </main>
</div>

async function fetchWithTimeout(url,options={},parentSignal=null,timeoutMs=18000){
  if(parentSignal?.aborted)throw makeAbortError();

}
async function fetchWithServerFallback(path,options={},parentSignal=null,timeoutMs=18000){

    try{
      const response=await fetchWithTimeout(base(path,candidate),options,parentSignal,timeoutMs);
      if([502,503,504].includes(response.status)){
        lastError=new Error(`服务器暂时不可用（${response.status}）`);

      }
      promoteServer(candidate);
      return response;
    }catch(error){
      if(parentSignal?.aborted)throw makeAbortError();
      lastError=error;
    }

}

}
async function consume(response,onEvent){
  if(!response.ok){let message='连接失败';try{message=(await response.json()).error||message}catch{}throw new Error(message)}
  if(!response.body)throw new Error('当前系统不支持流式回复');
  const reader=response.body.getReader(),decoder=new TextDecoder('utf-8');let buffer='';
  try{
    while(true){
      const{value,done}=await readStreamChunk(reader);if(done)break;
      buffer+=decoder.decode(value,{stream:true});let pos;
      while((pos=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,pos).trim();buffer=buffer.slice(pos+1);if(line)onEvent(JSON.parse(line))}
    }
    buffer+=decoder.decode();if(buffer.trim())onEvent(JSON.parse(buffer.trim()));
  }catch(error){try{await reader.cancel()}catch{}throw error}
}

async function sendMessage(){
  if(busyRequest)return;const conversation=activeConversation(),text=input.value.trim();if(!text&&!selectedFile)return;
  const fullImage=selectedData,previewImage=selectedPreview||selectedData,file=selectedFile;const priorMessages=[...conversation.messages];
  const userMessage={id:uid('msg'),role:'user',text:text||(file?'请识别并详细解答这张图片。':''),image:previewImage||'',imageName:file?.name||'',createdAt:Date.now(),state:'done'};
  conversation.messages.push(userMessage);if(conversation.title==='新对话')conversation.title=autoTitle(userMessage);conversation.updatedAt=Date.now();
  input.value='';autoResize();clearImage();persist();renderAll();await requestAnswer(conversation,userMessage,priorMessages,fullImage,file?.name||'camera.jpg');
}
function findPendingAnswer(){
  let selected=null;
  for(const conversation of appState.conversations){
    for(let index=0;index<conversation.messages.length;index++){
      const message=conversation.messages[index];
      if(message?.role!=='assistant'||!message.requestId)continue;
      if(!selected||Number(message.createdAt||0)>Number(selected.message.createdAt||0))selected={conversation,message,index};
    }
  }
  return selected;
}
function resumePendingAnswer(){
  if(busyRequest)return;
  const pending=findPendingAnswer();if(!pending)return;
  const{conversation,message,index}=pending;let userIndex=index-1;
  while(userIndex>=0&&conversation.messages[userIndex]?.role!=='user')userIndex--;
  if(userIndex<0){delete message.requestId;delete message.jobSubmitted;delete message.jobRevision;delete message.jobTextLength;message.state='done';message.text=message.text||'未找到原始问题，无法继续这次回答。';persist();renderAll();return}
  const userMessage=conversation.messages[userIndex],contextMessages=conversation.messages.slice(0,userIndex);
  message.state=message.text?'streaming':'thinking';message.status='正在接回电脑端未完成的回答……';persist();
  if(activeConversation()?.id===conversation.id)updateAssistantNode(conversation,message);else renderConversationList();
  requestAnswer(conversation,userMessage,contextMessages,userMessage.image||'',userMessage.imageName||'图片',message,Boolean(message.jobSubmitted));
}
async function requestAnswer(conversation,userMessage,contextMessages,imageData='',filename='图片',existingAssistant=null,startSubmitted=false){
  const rawMode=existingAssistant?.mode||conversation.mode,mode=['fast','thinking','expert'].includes(rawMode)?rawMode:'thinking',modeName=modeLabel(mode);
  const requestId=existingAssistant?.requestId||uid('request'),sessionId=remoteSessionId(conversation.id);
  const assistantMessage=existingAssistant||{id:uid('msg'),role:'assistant',mode,text:'',createdAt:Date.now(),state:'thinking',status:'正在把任务提交到电脑端……',requestId,jobSubmitted:false};
  assistantMessage.mode=mode;assistantMessage.requestId=requestId;
  if(!existingAssistant){conversation.messages.push(assistantMessage);conversation.updatedAt=Date.now();persist();renderAll()}
  const controller=new AbortController();busyRequest={conversationId:conversation.id,assistantId:assistantMessage.id,controller,requestId};updateComposerState();renderHeader();
  const endpoint=imageData?'/chat-image-job':'/chat-job',history=buildHistory(contextMessages);
  const payload=imageData?
    {token:accessToken,session_id:sessionId,request_id:requestId,mode,message:userMessage.text,filename,image:imageData,history}:
    {token:accessToken,session_id:sessionId,request_id:requestId,mode,message:userMessage.text,history};
  let submitted=Boolean(startSubmitted),completed=false,networkFailures=0,useLegacyPolling=false,lastPersistedText=assistantMessage.text||'';
  let lastRevision=Math.max(0,Number(assistantMessage.jobRevision||0)),knownTextLength=Math.max(0,Number(assistantMessage.jobTextLength||Array.from(assistantMessage.text||'').length));
  const persistProgress=force=>{
    assistantMessage.jobSubmitted=submitted;assistantMessage.jobRevision=lastRevision;assistantMessage.jobTextLength=knownTextLength;
    if(force||(assistantMessage.text||'').length-lastPersistedText.length>60){lastPersistedText=assistantMessage.text||'';conversation.updatedAt=Date.now();persist()}
  };
  const resetForResubmit=()=>{
    submitted=false;lastRevision=0;knownTextLength=0;lastPersistedText='';assistantMessage.text='';assistantMessage.state='thinking';assistantMessage.status='电脑端任务记录已重置，正在重新生成完整回答……';persistProgress(true);updateAssistantNode(conversation,assistantMessage);
  };
  const updateFromJob=job=>{
    if(job.ocr){assistantMessage.ocr={text:job.ocr.text||'',confidence:Number(job.ocr.confidence||0),lineCount:Number(job.ocr.line_count||0)}}
    const revision=Number(job.revision||0);if(Number.isFinite(revision)&&revision>lastRevision)lastRevision=revision;
    let nextText=assistantMessage.text||'',textChanged=false;
    if(typeof job.text==='string'){
      nextText=job.text;textChanged=nextText!==assistantMessage.text;
    }else if(typeof job.text_delta==='string'){
      nextText=job.reset_text?job.text_delta:(assistantMessage.text||'')+job.text_delta;textChanged=nextText!==assistantMessage.text;
    }
    if(Number.isFinite(Number(job.text_length)))knownTextLength=Math.max(0,Number(job.text_length));
    else knownTextLength=Array.from(nextText).length;
    if(textChanged){assistantMessage.text=nextText;assistantMessage.state=nextText?'streaming':'thinking';assistantMessage.status=job.stage||`${modeName}正在回答……`;updateAssistantNode(conversation,assistantMessage)}
    else if(!assistantMessage.text){assistantMessage.status=job.stage||`${modeName}正在处理……`;assistantMessage.state='thinking';updateAssistantNode(conversation,assistantMessage)}
    persistProgress(job.state==='done'||job.state==='error'||job.state==='cancelled');
  };
  try{
    while(!completed){
      if(!submitted){
        assistantMessage.status=networkFailures?'网络恢复后正在重新提交任务……':'正在把任务提交到电脑端……';assistantMessage.state=assistantMessage.text?'streaming':'thinking';updateAssistantNode(conversation,assistantMessage);
        try{
          const response=await fetchWithServerFallback(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)},controller.signal,imageData?60000:15000);
          const initial=await response.json().catch(()=>({}));
          if(!response.ok){const failure=new Error(initial.error||`任务提交失败（${response.status}）`);failure.fatal=response.status>=400&&response.status<500;throw failure}
          submitted=true;networkFailures=0;assistantMessage.jobSubmitted=true;updateFromJob(initial);persistProgress(true);
        }catch(error){
          if(controller.signal.aborted)throw makeAbortError();
          if(error.fatal)throw error;
          networkFailures++;
          assistantMessage.status=`网络暂时不可用，电脑端连接恢复后会自动继续（第${networkFailures}次等待）……`;assistantMessage.state=assistantMessage.text?'streaming':'thinking';updateAssistantNode(conversation,assistantMessage);
          await waitWithAbort(Math.min(NETWORK_RETRY_MAX_MS,500*Math.pow(2,Math.min(networkFailures-1,3))),controller.signal);
          continue;
        }
      }

      const query=`request_id=${encodeURIComponent(requestId)}&session=${encodeURIComponent(sessionId)}&after=${lastRevision}&offset=${knownTextLength}&t=${Date.now()}`;
      try{
        if(useLegacyPolling){
          const legacyQuery=query+`&wait_ms=${JOB_LONG_POLL_MS}`;
          const response=await fetchWithServerFallback('/api/job?'+legacyQuery,{cache:'no-store',headers:authHeaders(false,conversation.id)},controller.signal,JOB_FETCH_TIMEOUT_MS);
          if(response.status===404){resetForResubmit();continue}
          const job=await response.json().catch(()=>({}));
          if(!response.ok){const failure=new Error(job.error||`获取回答失败（${response.status}）`);failure.fatal=response.status>=400&&response.status<500;throw failure}
          networkFailures=0;updateFromJob(job);
          if(job.state==='done'){completed=true;continue}
          if(job.state==='error'){const failure=new Error(job.error||'电脑端生成回答失败');failure.fatal=true;throw failure}
          if(job.state==='cancelled')throw makeAbortError();
          continue;
        }
        const response=await fetchWithServerFallback('/api/job-stream?'+query,{cache:'no-store',headers:authHeaders(false,conversation.id)},controller.signal,JOB_STREAM_CONNECT_TIMEOUT_MS);
        if(response.status===404){
          const contentType=response.headers.get('content-type')||'';let detail={};
          if(contentType.includes('application/json')){try{detail=await response.json()}catch{}}
          if(detail.state==='missing'){resetForResubmit();continue}
          useLegacyPolling=true;continue;
        }
        if(!response.ok){let detail={};try{detail=await response.json()}catch{}const failure=new Error(detail.error||`获取回答失败（${response.status}）`);failure.fatal=response.status>=400&&response.status<500;throw failure}
        networkFailures=0;let missing=false;
        await consume(response,event=>{
          if(event.type==='heartbeat')return;
          if(event.type==='missing'){missing=true;return}
          if(event.type!=='job')return;
          const job=event.job||{};updateFromJob(job);
          if(job.state==='done'){completed=true;return}
          if(job.state==='error'){const failure=new Error(job.error||'电脑端生成回答失败');failure.fatal=true;throw failure}
          if(job.state==='cancelled')throw makeAbortError();
        });
        if(missing){resetForResubmit();continue}
        if(!completed)await waitWithAbort(120,controller.signal);
      }catch(error){
        if(controller.signal.aborted)throw makeAbortError();
        if(error.fatal)throw error;
        networkFailures++;
        assistantMessage.status=assistantMessage.text?'网络有波动，电脑端仍在继续生成，恢复后会自动接上……':`暂时无法连接电脑，正在自动等待恢复（${networkFailures}）……`;
        assistantMessage.state=assistantMessage.text?'streaming':'thinking';updateAssistantNode(conversation,assistantMessage);
        await waitWithAbort(Math.min(NETWORK_RETRY_MAX_MS,350*Math.pow(2,Math.min(networkFailures-1,4))),controller.signal);
      }
    }
    if(!assistantMessage.text)assistantMessage.text='暂时没有生成有效回答，请再试一次。';
    assistantMessage.state='done';assistantMessage.status='';delete assistantMessage.requestId;delete assistantMessage.jobSubmitted;delete assistantMessage.jobRevision;delete assistantMessage.jobTextLength;conversation.updatedAt=Date.now();persist();if(activeConversation()?.id===conversation.id)renderMessages();else renderConversationList();
  }catch(error){
    if(error.name==='AbortError'){
      simplePost('/api/job-cancel',{token:accessToken,session_id:sessionId,request_id:requestId}).catch(()=>{});
      assistantMessage.state='done';assistantMessage.text=assistantMessage.text||'已停止生成。';assistantMessage.status='';
    }else{
      assistantMessage.state='done';assistantMessage.text=assistantMessage.text||`电脑端生成失败：${error.message||'未知错误'}`;assistantMessage.status='';
    }
    delete assistantMessage.requestId;delete assistantMessage.jobSubmitted;delete assistantMessage.jobRevision;delete assistantMessage.jobTextLength;conversation.updatedAt=Date.now();persist();if(activeConversation()?.id===conversation.id)renderMessages();else renderConversationList();
  }finally{busyRequest=null;updateComposerState();renderHeader();if(appForeground)input.focus();setTimeout(resumePendingAnswer,0)}
}
function handleMessageAction(event){const action=event.currentTarget.dataset.action,id=event.currentTarget.dataset.id,conversation=activeConversation(),index=conversation.messages.findIndex(item=>item.id===id),message=conversation.messages[index];if(!message)return;if(action==='copy')copyText(message.text);if(action==='regenerate')regenerateAnswer(index)}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast('已复制')}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();showToast('已复制')}}
function regenerateAnswer(assistantIndex){if(busyRequest)return;const conversation=activeConversation();let userIndex=assistantIndex-1;while(userIndex>=0&&conversation.messages[userIndex].role!=='user')userIndex--;if(userIndex<0)return;const userMessage=conversation.messages[userIndex],context=conversation.messages.slice(0,userIndex);conversation.messages=conversation.messages.slice(0,assistantIndex);conversation.updatedAt=Date.now();persist();renderAll();requestAnswer(conversation,userMessage,context,userMessage.image||'',userMessage.imageName||'图片')}

function compareVersion(left,right){const a=String(left||'0').split('.').map(v=>parseInt(v,10)||0),b=String(right||'0').split('.').map(v=>parseInt(v,10)||0);for(let i=0;i<Math.max(a.length,b.length);i++){const diff=(a[i]||0)-(b[i]||0);if(diff)return diff}return 0}
function installedAppVersion(){try{const nativeVersion=window.YanboAndroid?.getAppVersion?.();if(nativeVersion)return String(nativeVersion)}catch{}return APP_VERSION}
function downloadUrl(url){if(!url)return'';const absolute=/^https?:\/\//i.test(url)?url:base(url.startsWith('/')?url:'/'+url);if(!accessToken)return absolute;return absolute+(absolute.includes('?')?'&':'?')+'token='+encodeURIComponent(accessToken)}
function updateNotesHtml(notes){const rows=Array.isArray(notes)&&notes.length?notes:['优化界面与使用体验'];return rows.slice(0,5).map(note=>`<div>• ${escapeHtml(note)}</div>`).join('')}
function showUpdateDialog(info,url){
  if(!url)return;availableUpdate={info,url};updateDownloadStarted=false;
  $('updateVersion').textContent=`彦博 AI ${info.app_version||''}`;$('updateNotes').innerHTML=updateNotesHtml(info.release_notes);
  $('updateProgress').classList.remove('show');$('updateProgressBar').style.width='0%';$('updateProgressText').textContent='准备下载更新……';
  $('updateNow').disabled=false;$('updateNow').textContent='立即更新';$('updateLater').disabled=false;$('updateDialog').classList.add('open');$('update').style.display='none';
}
function closeUpdateDialog(showReminder=true){if(updateDownloadStarted)return;$('updateDialog').classList.remove('open');if(showReminder&&availableUpdate){$('update').style.display='block';$('update').innerHTML=`彦博 AI ${escapeHtml(availableUpdate.info.app_version||'')} 可更新 <button type="button" id="showUpdateAgain">查看</button>`;setTimeout(()=>{const button=$('showUpdateAgain');if(button)button.onclick=()=>showUpdateDialog(availableUpdate.info,availableUpdate.url)},0)}}
function setUpdateProgress(percent,text){$('updateProgress').classList.add('show');if(Number.isFinite(percent))$('updateProgressBar').style.width=Math.max(0,Math.min(100,percent))+'%';if(text)$('updateProgressText').textContent=text}
function startUpdate(){
  if(!availableUpdate||updateDownloadStarted)return;updateDownloadStarted=true;$('updateNow').disabled=true;$('updateLater').disabled=true;$('updateNow').textContent='正在更新';setUpdateProgress(2,'正在连接更新服务器……');
  try{
    if(window.YanboAndroid&&typeof window.YanboAndroid.installUpdate==='function')window.YanboAndroid.installUpdate(availableUpdate.url,String(availableUpdate.info.app_version||''),String(availableUpdate.info.android_sha256||''),Number(availableUpdate.info.android_size_bytes||0));
    else{setUpdateProgress(15,'正在打开下载页面……');window.location.href=availableUpdate.url;setTimeout(()=>{updateDownloadStarted=false;$('updateNow').disabled=false;$('updateLater').disabled=false;$('updateNow').textContent='立即更新'},1800)}
  }catch(error){updateDownloadStarted=false;$('updateNow').disabled=false;$('updateLater').disabled=false;$('updateNow').textContent='重试';setUpdateProgress(0,'更新启动失败，请重试');showToast(error.message||'无法启动更新')}
}
window.onYanboUpdateStatus=function(payload){
  let event=payload;try{if(typeof payload==='string')event=JSON.parse(payload)}catch{event={status:'error',message:String(payload||'更新失败')}}
  const status=event?.status||'',percent=Number(event?.percent);
  if(status==='started')setUpdateProgress(3,event.message||'开始下载更新……');
  else if(status==='progress')setUpdateProgress(Number.isFinite(percent)?percent:8,event.message||`正在下载 ${Math.round(percent||0)}%`);
  else if(status==='permission'){setUpdateProgress(100,event.message||'请允许彦博 AI 安装应用更新');}
  else if(status==='installing'){setUpdateProgress(100,event.message||'下载完成，正在打开安装界面……');$('updateNow').textContent='等待安装';}
  else if(status==='error'){updateDownloadStarted=false;$('updateNow').disabled=false;$('updateLater').disabled=false;$('updateNow').textContent='重试';setUpdateProgress(0,event.message||'更新失败，请重试');}
};
async function checkUpdate(manual=false){
  if(updateCheckPromise)return updateCheckPromise;
  updateCheckPromise=(async()=>{
    let lastError=null;
    for(let attempt=0;attempt<3;attempt++){
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
      try{
        const response=await fetchWithServerFallback('/api/version?t='+Date.now(),{cache:'no-store'},controller.signal,12000);
        if(!response.ok)throw new Error('版本服务返回 '+response.status);
        const info=await response.json(),current=installedAppVersion();
        const isAndroid=Boolean(window.YanboAndroid)||navigator.userAgent.toLowerCase().includes('android');
        const rawUrl=isAndroid?info.android_download_url:info.ios_download_url,url=downloadUrl(rawUrl);
        if(compareVersion(info.app_version,current)>0&&url){
          if(!availableUpdate||availableUpdate.info.app_version!==info.app_version)showUpdateDialog(info,url);
        }else if(manual){showToast(`当前已是最新版本 ${current}`)}
        return true;
      }catch(error){lastError=error;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,900*(attempt+1)))}
      finally{clearTimeout(timer)}
    }
    if(manual)showToast(`检查更新失败：${lastError?.message||'网络异常'}`);
    return false;
  })().finally(()=>{updateCheckPromise=null});
  return updateCheckPromise;
}
function scheduleUpdateChecks(){for(const delay of UPDATE_RETRY_DELAYS)setTimeout(()=>{if(appForeground&&!availableUpdate)checkUpdate(false)},delay)}
async function warmConnection(){const dot=$('connectionDot'),label=$('connectionText');try{const path='/api/auth-check?token='+encodeURIComponent(accessToken)+'&t='+Date.now();const response=await fetchWithServerFallback(path,{cache:'no-store'},null,12000);if(!response.ok)throw new Error();dot.classList.add('online');label.textContent='电脑服务已连接'}catch{dot.classList.remove('online');label.textContent='电脑服务暂时不可用'}}
window.onYanboNetworkChanged=function(online){const dot=$('connectionDot'),label=$('connectionText');if(online){label.textContent='网络已恢复，正在连接电脑服务';warmConnection();if(busyRequest&&appForeground)showToast('网络已恢复，正在自动恢复回答')}else{dot.classList.remove('online');label.textContent='手机网络已断开'}};

$('updateLater').onclick=()=>closeUpdateDialog(true);$('updateNow').onclick=startUpdate;$('updateDialog').onclick=event=>{if(event.target===$('updateDialog'))closeUpdateDialog(true)};
window.addEventListener('online',()=>{warmConnection();checkUpdate()});window.addEventListener('offline',warmConnection);document.addEventListener('visibilitychange',()=>{setAppForeground(!document.hidden);if(!document.hidden){warmConnection();checkUpdate()}});
renderAll();autoResize();warmConnection();checkUpdate(false);scheduleUpdateChecks();setTimeout(resumePendingAnswer,0);setInterval(()=>{if(!document.hidden)warmConnection()},30000);input.focus();
